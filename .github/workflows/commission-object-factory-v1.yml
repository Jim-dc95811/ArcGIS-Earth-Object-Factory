name: Promote exact Object Factory v1.0 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.head_commit.message == 'Trigger exact Object Factory v1.0 source promotion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote accepted v0.2.2 behavior to exact v1.0 source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          src = Path('Object_Factory_v0.2_TEST.py')
          if not src.exists():
              raise SystemExit('Expected baseline source Object_Factory_v0.2_TEST.py is missing.')
          s = src.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              s = s.replace(old, new, 1)

          one('VERSION = "0.2 TEST"', 'VERSION = "1.0"', 'version')
          one('Object Factory v0.2 accepts PNG icons only.', 'Object Factory accepts PNG icons only.', 'PNG message')
          one('self.status = tk.StringVar(value="Factory ready. v0.2 UX simplified; proven object/batch/compass behavior preserved; awaiting live ArcGIS Earth acceptance.")',
              'self.status = tk.StringVar(value="Factory ready. Object Factory v1.0 commissioned for ArcGIS Earth.")', 'status')
          one('ttk.Label(t,text="Info text").grid(row=r,column=0,sticky="nw",padx=(0,8),pady=4);self.object_desc=tk.Text(t,height=4,wrap="word");self.object_desc.grid(row=r,column=1,columnspan=3,sticky="nsew",pady=4);t.rowconfigure(r,weight=1);r+=1',
              'ttk.Label(t,text="Info text").grid(row=r,column=0,sticky="nw",padx=(0,8),pady=4);self.object_desc=tk.Text(t,height=2,wrap="word");self.object_desc.grid(row=r,column=1,columnspan=3,sticky="ew",pady=4);r+=1', 'Info-text layout')
          one('pf=max(1,math.ceil(max(w,h)/96));', 'pf=max(1,math.ceil(max(w,h)/72));', 'preview cap')
          one('outf=ttk.Frame(t);outf.grid(row=r,column=0,columnspan=4,sticky="ew",pady=(8,0));',
              'outf=ttk.Frame(t);outf.grid(row=r,column=0,columnspan=4,sticky="ew",pady=(8,12));', 'bottom button margin')

          Path('Object_Factory_v1.0.py').write_text(s, encoding='utf-8', newline='\n')
          PY

          echo "e77e1866e7a87b9824ed6bb1cd0f830f52adb1a2872efe48ede13a581018aa00  Object_Factory_v1.0.py" | sha256sum -c -
          python -m py_compile Object_Factory_v1.0.py

          cat > Run_Object_Factory.bat <<'BAT'
          @echo off
          cd /d "%~dp0"
          py -3 Object_Factory_v1.0.py
          if errorlevel 1 python Object_Factory_v1.0.py
          BAT

          mkdir -p legacy/Object_Factory_pre1
          cp Object_Factory_v0.2_TEST.py legacy/Object_Factory_pre1/Object_Factory_v0.2_TEST.py
          rm Object_Factory_v0.2_TEST.py

      - name: Commit exact accepted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jim Gaddy'
          git config user.email 'jimgdc95811@gmail.com'
          git add Object_Factory_v1.0.py Run_Object_Factory.bat legacy/Object_Factory_pre1/Object_Factory_v0.2_TEST.py Object_Factory_v0.2_TEST.py
          git commit -m 'Promote exact accepted Object Factory v1.0 source'
          git push origin HEAD:main
